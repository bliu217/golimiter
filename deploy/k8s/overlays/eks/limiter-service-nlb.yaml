# gRPC stays on L4. An HTTP/1 ALB would break it.
# Keep the NLB internal until the limiter has auth. Redis stays ClusterIP-only.
apiVersion: v1
kind: Service
metadata:
  name: limiter
  namespace: golimiter
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
spec:
  type: LoadBalancer
