apiVersion: v1
kind: ConfigMap
metadata:
  name: limiter-config
  namespace: golimiter
data:
  limiter.yaml: |
    server:
      grpc_port: 50051

    storage: redis

    redis:
      addr: redis:6379
      password: ""
      db: 0
      key_prefix: golimiter
      dial_timeout_ms: 500
      read_timeout_ms: 200
      write_timeout_ms: 200
      pool_size: 50

    limiter:
      algorithm: token_bucket

      token_bucket:
        capacity: 10
        refill_rate: 5
        lease_size: 0

      fixed_window:
        limit: 100
        window_seconds: 60

      sliding_window:
        limit: 100
        window_seconds: 60
